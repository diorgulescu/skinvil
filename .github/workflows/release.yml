name: Release Skinvil Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Release (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal (.dmg running natively on both Apple Silicon & Intel)
          - label: 'macOS Universal'
            platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'

          # macOS Apple Silicon dedicated (.dmg)
          - label: 'macOS Apple Silicon'
            platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

          # Windows x64 (.msi & NSIS -setup.exe)
          - label: 'Windows x64'
            platform: 'windows-latest'
            rust_targets: ''
            args: ''

          # Linux x64 (.AppImage, .deb & .rpm)
          - label: 'Linux x64'
            platform: 'ubuntu-22.04'
            rust_targets: ''
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit2GTK 4.1 & AppImage system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            xdg-utils \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Run Rust backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and attach Tauri installers to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 'true'
        with:
          tagName: v__VERSION__
          releaseName: 'Skinvil v__VERSION__'
          releaseBody: |
            ## Skinvil v__VERSION__ — 100% Offline 3D Voxel Skin Creator & `.mcpack` Studio

            ### Downloads
            - **macOS (Apple Silicon & Universal):** Download the `.dmg`, drag **Skinvil.app** to **Applications**, and if Gatekeeper blocks unsigned apps run `xattr -cr /Applications/Skinvil.app` in Terminal.
            - **Windows (x64):** Download the `.msi` or `-setup.exe` installer (if Windows SmartScreen appears, click **More info → Run anyway**).
            - **Linux (x64):** Download the `.AppImage` (`chmod +x Skinvil*.AppImage`), Debian/Ubuntu `.deb`, or Fedora/RHEL `.rpm` package.

            > NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
