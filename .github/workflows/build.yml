# SPDX-License-Identifier: GPL-3.0-only
name: Build Desktop Binaries (Linux, macOS, Windows)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Linux x64 (.AppImage, .deb, .rpm)'
            platform: 'ubuntu-22.04'
            rust_targets: ''
            tauri_args: ''
            artifact_name: 'skinvil-linux-x64'
            artifact_paths: |
              src-tauri/target/release/skinvil
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

          - label: 'macOS Universal (.dmg — Apple Silicon & Intel)'
            platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin'
            artifact_name: 'skinvil-macos-universal'
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

          - label: 'Windows x64 (.msi, -setup.exe)'
            platform: 'windows-latest'
            rust_targets: ''
            tauri_args: ''
            artifact_name: 'skinvil-windows-x64'
            artifact_paths: |
              src-tauri/target/release/skinvil.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit2GTK 4.1 & AppImage system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            xdg-utils \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Run Rust backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri desktop binaries & installers
        env:
          NO_STRIP: 'true'
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Upload built binaries & installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
