# SPDX-License-Identifier: GPL-3.0-only
name: Deploy Project Homepage to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Prepare Homepage Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync canonical app-icon.svg and verify homepage assets
        run: |
          cp ./app-icon.svg ./site/app-icon.svg
          for asset in \
            ./site/index.html \
            ./site/styles.css \
            ./site/app-icon.svg \
            ./site/screenshots/studio-3d.png \
            ./site/screenshots/wardrobe-mcpack.png \
            ./site/screenshots/poses-outer-ro.png; do
            test -s "$asset" || { echo "Missing or empty asset: $asset" >&2; exit 1; }
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
