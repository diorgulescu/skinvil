[package]
name = "skinvil"
version = "0.1.0"
description = "Skinvil — Kid-friendly 100% offline 3D voxel character skin creator and .mcpack packager"
authors = ["Skinvil Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/skinvil/skinvil"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "skinvil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
