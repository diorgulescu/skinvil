<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="100%" stop-color="#12141C"/>
    </linearGradient>
  </defs>

  <!-- macOS / Cross-platform Squircle Background (with safe padding) -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bgGrad)" shape-rendering="geometricPrecision"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="#2E3546" stroke-width="16" shape-rendering="geometricPrecision"/>

  <!-- Subtle Forge Glow Behind Anvil -->
  <rect x="288" y="320" width="448" height="256" fill="#252B3B" opacity="0.6"/>

  <!-- PIXEL PAINT BLOCKS ON TOP OF THE ANVIL (Representing Voxel Skin Crafting) -->
  <!-- Left Paint Cube: Cyan / Diamond -->
  <rect x="352" y="256" width="96" height="96" fill="#22D3EE"/>
  <rect x="352" y="256" width="96" height="24" fill="#67E8F9"/>
  <rect x="352" y="328" width="96" height="24" fill="#0891B2"/>

  <!-- Center Paint Cube: Emerald Green (Raised slightly) -->
  <rect x="464" y="208" width="96" height="144" fill="#10B981"/>
  <rect x="464" y="208" width="96" height="28" fill="#34D399"/>
  <rect x="464" y="324" width="96" height="28" fill="#059669"/>

  <!-- Right Paint Cube: Warm Gold / Amber -->
  <rect x="576" y="256" width="96" height="96" fill="#F59E0B"/>
  <rect x="576" y="256" width="96" height="24" fill="#FBBF24"/>
  <rect x="576" y="328" width="96" height="24" fill="#D97706"/>

  <!-- Floating Forge Pixel Sparks -->
  <rect x="272" y="208" width="32" height="32" fill="#FBBF24"/>
  <rect x="720" y="192" width="32" height="32" fill="#22D3EE"/>
  <rect x="656" y="144" width="24" height="24" fill="#F43F5E"/>
  <rect x="352" y="160" width="24" height="24" fill="#34D399"/>

  <!-- BLOCKY IRON ANVIL -->
  <!-- Anvil Horn (Left Snout) -->
  <rect x="176" y="400" width="96" height="80" fill="#64748B"/>
  <rect x="176" y="400" width="96" height="24" fill="#94A3B8"/>
  <rect x="224" y="480" width="48" height="32" fill="#475569"/>

  <!-- Anvil Top Face / Working Table -->
  <rect x="272" y="368" width="544" height="144" fill="#64748B"/>
  <!-- Top Metallic Specular Highlight -->
  <rect x="272" y="368" width="544" height="32" fill="#CBD5E1"/>
  <!-- Heel Overhang Shadow (Right) -->
  <rect x="736" y="480" width="80" height="32" fill="#334155"/>
  <!-- Table Lower Bevel -->
  <rect x="272" y="480" width="464" height="32" fill="#475569"/>

  <!-- Anvil Waist / Neck -->
  <rect x="384" y="512" width="288" height="144" fill="#475569"/>
  <!-- Waist Inner Shadow -->
  <rect x="384" y="512" width="288" height="32" fill="#334155"/>
  <!-- Waist Forged Emblem (3 subtle rivets/pixels) -->
  <rect x="448" y="568" width="32" height="32" fill="#94A3B8"/>
  <rect x="512" y="568" width="32" height="32" fill="#94A3B8"/>
  <rect x="576" y="568" width="32" height="32" fill="#94A3B8"/>

  <!-- Anvil Stepped Heavy Base -->
  <!-- Upper Step -->
  <rect x="304" y="656" width="448" height="64" fill="#64748B"/>
  <rect x="304" y="656" width="448" height="20" fill="#94A3B8"/>
  <!-- Lower Foot -->
  <rect x="240" y="720" width="576" height="96" fill="#475569"/>
  <rect x="240" y="720" width="576" height="24" fill="#64748B"/>
  <rect x="240" y="784" width="576" height="32" fill="#1E293B"/>
</svg>